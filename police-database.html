      function searchCases(e) {
        e.preventDefault();
        const query = document.getElementById("caseInput").value.toLowerCase().trim();
        if (!query) {
          alert("Please enter a case number");
          return;
        }
        const results = cases.filter(
          (c) => c.number.toLowerCase().includes(query) || c.keywords.some((k) => query.includes(k))
        );
        displayResults(results, query);
      }

      function displayResults(results, query) {
        document.querySelector(".search-section").style.display = "none";
        document.getElementById("resultsSection").classList.add("active");
        const container = document.getElementById("resultsContainer");
        if (results.length === 0) {
          container.innerHTML =
            '<div style="text-align:center; padding:60px; color:#999;"><div style="font-size:3rem; margin-bottom:20px;">🔍</div><p>No cases found matching "' +
            query +
            '"</p></div>';
        } else {
          container.innerHTML = results
            .map(
              (c) => `
                    <div class="case-card ${
                      c.redHerring ? "red-herring" : ""
                    }" onclick="openCase('${c.number}')">
                        <div class="case-header">
                            <div class="case-number">${c.number}</div>
                            <div class="case-status status-${
                              c.status
                            }">${c.status.toUpperCase()}</div>
                        </div>
                        <div class="case-summary">
                            <strong>${c.type}</strong><br>
                            ${c.victim !== "N/A" ? "Victim: " + c.victim + "<br>" : ""}
                            ${c.summary}
                        </div>
                        <div class="case-date">📅 ${c.date}</div>
                    </div>
                `
            )
            .join("");
        }
      }

      function openCase(caseNumber) {
        const caseData = cases.find((c) => c.number === caseNumber);
        if (caseData) {
          document.getElementById("docTitle").textContent = "Case " + caseNumber;
          document.getElementById("docContent").textContent = caseData.content;
          document.getElementById("docModal").classList.add("active");
        }
      }

      function closeDoc() {
        document.getElementById("docModal").classList.remove("active");
      }
      function newSearch() {
        document.querySelector(".search-section").style.display = "block";
        document.getElementById("resultsSection").classList.remove("active");
        document.getElementById("caseInput").value = "";
      }
      window.onclick = (e) => {
        if (e.target.id === "docModal") closeDoc();
      };
    </script>
  </body>
</html>
