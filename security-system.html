<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>FSM Security System</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Courier New", monospace;
        background: #0a0a0a;
        color: #00ff00;
        min-height: 100vh;
        padding: 20px;
      }
      .container {
        max-width: 1400px;
        margin: 0 auto;
        background: #1a1a1a;
        border: 2px solid #00ff00;
        border-radius: 10px;
        overflow: hidden;
      }
      .header {
        background: #000;
        padding: 20px;
        border-bottom: 2px solid #00ff00;
        text-align: center;
      }
      .header h1 {
        font-size: 1.8rem;
        margin-bottom: 5px;
        text-shadow: 0 0 10px #00ff00;
      }
      .access-panel {
        padding: 40px;
        display: block;
      }
      .access-panel.hidden {
        display: none;
      }
      .access-form {
        background: #000;
        border: 2px solid #00ff00;
        padding: 30px;
        max-width: 500px;
        margin: 0 auto;
        border-radius: 8px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #00ff00;
      }
      .form-group input {
        width: 100%;
        padding: 10px;
        background: #000;
        border: 1px solid #00ff00;
        color: #00ff00;
        font-family: "Courier New", monospace;
        font-size: 1rem;
      }
      .access-btn {
        width: 100%;
        padding: 12px;
        background: #00ff00;
        color: #000;
        border: none;
        font-weight: bold;
        cursor: pointer;
        font-family: "Courier New", monospace;
      }
      .error-msg {
        background: #ff0000;
        color: #fff;
        padding: 10px;
        margin-top: 15px;
        text-align: center;
        display: none;
      }
      .back-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #00ff00;
        text-decoration: none;
      }
      .main-interface {
        display: none;
        padding: 30px;
      }
      .main-interface.active {
        display: block;
      }
      .camera-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }
      .camera-card {
        background: #000;
        border: 2px solid #00ff00;
        padding: 20px;
        cursor: pointer;
        transition: all 0.3s;
      }
      .camera-card:hover {
        box-shadow: 0 0 20px #00ff00;
        transform: scale(1.02);
      }
      .camera-card.corrupted {
        opacity: 0.3;
        cursor: not-allowed;
      }
      .camera-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 15px;
      }
      .camera-id {
        font-size: 1.2rem;
        font-weight: bold;
      }
      .status-active {
        background: #00ff00;
        color: #000;
        padding: 4px 10px;
        font-size: 0.8rem;
      }
      .status-corrupted {
        background: #ff0000;
        color: #fff;
        padding: 4px 10px;
        font-size: 0.8rem;
      }
      .logout-btn {
        padding: 10px 20px;
        background: #ff0000;
        color: #fff;
        border: none;
        cursor: pointer;
        font-family: "Courier New", monospace;
        margin-bottom: 20px;
      }
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.95);
        z-index: 1000;
      }
      .modal.active {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .modal-content {
        background: #000;
        border: 3px solid #00ff00;
        width: 90%;
        max-width: 1000px;
        max-height: 90vh;
        overflow-y: auto;
        padding: 30px;
        position: relative;
      }
      .close-btn {
        position: absolute;
        top: 10px;
        right: 15px;
        font-size: 2rem;
        color: #00ff00;
        cursor: pointer;
      }
      .timestamp-entry {
        background: #0a0a0a;
        border-left: 3px solid #00ff00;
        padding: 12px;
        margin-bottom: 10px;
      }
      .timestamp {
        color: #00ff00;
        font-weight: bold;
        margin-bottom: 5px;
      }
      .alert {
        color: #ff0000;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>📹 FSM SECURITY MONITORING SYSTEM</h1>
        <p>Faculty of Science of Monastir | CCTV Archive Access</p>
      </div>
      <div class="access-panel" id="accessPanel">
        <div class="access-form">
          <h2 style="text-align: center; margin-bottom: 20px; color: #00ff00">
            AUTHORIZED ACCESS ONLY
          </h2>
          <form onsubmit="accessSystem(event)">
            <div class="form-group">
              <label>ACCESS CODE</label>
              <input type="password" id="accessCode" placeholder="Enter security code" />
            </div>
            <button type="submit" class="access-btn">ACCESS SYSTEM</button>
            <div class="error-msg" id="errorMsg">ACCESS DENIED</div>
          </form>
          <a href="index.html" class="back-link">← EXIT SYSTEM</a>
        </div>
      </div>
      <div class="main-interface" id="mainInterface">
        <button class="logout-btn" onclick="logout()">⬅ LOGOUT</button>
        <h2 style="margin-bottom: 20px">AVAILABLE CAMERA FEEDS</h2>
        <div class="camera-grid" id="cameraGrid"></div>
      </div>
    </div>
    <div class="modal" id="footageModal">
      <div class="modal-content">
        <span class="close-btn" onclick="closeFootage()">&times;</span>
        <div id="footageContent"></div>
      </div>
    </div>
    <script>
      const ACCESS_CODE = "fsm2025";
      const cameras = [
        {
          id: "CAM-01",
          location: "Residence El Ferdaous - Main Entrance",
          date: "December 10, 2025",
          status: "active",
          footage: [
            { time: "20:15:44", event: "Aziz Krifa enters building (alone, laptop bag)" },
            { time: "21:08:22", event: "Ela Hassine enters building (alone, checking phone)" },
            { time: "21:37:14", event: "Ela Hassine exits building (walking quickly, on phone)" },
            {
              time: "21:52:33",
              event: "Yassine Azzouz enters building (alone, dark jacket, backpack, nervous)",
            },
            {
              time: "22:18:41",
              event: "⚠ ALERT: Yassine Azzouz exits via EMERGENCY EXIT (running, NO backpack)",
              alert: true,
            },
          ],
        },
        {
          id: "CAM-02",
          location: "Residence El Ferdaous - 3rd Floor Stairwell",
          date: "December 10, 2025",
          status: "active",
          footage: [
            { time: "21:11:07", event: "Female (Ela - clothing match) walks to 3rd floor, knocks" },
            { time: "21:35:58", event: "Ela exits apartment alone, walks down calmly" },
            { time: "21:54:19", event: "Male (Yassine - clothing match) runs up to 3rd floor" },
            {
              time: "22:17:22",
              event: "⚠ CRITICAL: TWO FIGURES STRUGGLING near doorway",
              alert: true,
            },
            { time: "22:18:02", event: "⚠ AUDIO: Loud CRASH (fall)", alert: true },
            { time: "22:18:11", event: "Yassine visible on 2nd floor, continues running" },
          ],
        },
        {
          id: "CAM-03",
          location: "IEEE Office - Main Entrance",
          date: "December 13, 2025",
          status: "active",
          footage: [
            { time: "20:18:33", event: "Ela Hassine enters building (alone)" },
            {
              time: "21:58:47",
              event: "⚠ Unknown person enters (hooded, ~175-180cm)",
              alert: true,
            },
            { time: "22:47:03", event: "⚠ Unknown person exits RUNNING", alert: true },
          ],
        },
        {
          id: "CAM-04",
          location: "FSM Library - Entrance",
          date: "December 13, 2025",
          status: "active",
          footage: [
            { time: "20:15:22", event: "Fares Klaii enters library (alone)" },
            { time: "23:22:18", event: "Fares Klaii exits library (alone)" },
          ],
        },
        {
          id: "CAM-05",
          location: "Main Campus Gate",
          date: "December 10, 2025",
          status: "corrupted",
          footage: [],
        },
        {
          id: "CAM-06",
          location: "Parking Lot",
          date: "December 12, 2025",
          status: "corrupted",
          footage: [],
        },
      ];
      function accessSystem(e) {
        e.preventDefault();
        if (document.getElementById("accessCode").value.toLowerCase() === ACCESS_CODE) {
          document.getElementById("accessPanel").classList.add("hidden");
          document.getElementById("mainInterface").classList.add("active");
          loadCameras();
        } else {
          const err = document.getElementById("errorMsg");
          err.style.display = "block";
          setTimeout(() => (err.style.display = "none"), 3000);
        }
      }
      function loadCameras() {
        document.getElementById("cameraGrid").innerHTML = cameras
          .map(
            (cam) => `
<div class="camera-card ${cam.status === "corrupted" ? "corrupted" : ""}" onclick="${
              cam.status === "active" ? `viewFootage('${cam.id}')` : ""
            }">
<div class="camera-header">
<div class="camera-id">${cam.id}</div>
<div class="status-${cam.status}">${cam.status.toUpperCase()}</div>
</div>
<div style="color:#00aa00; font-size:0.9rem; line-height:1.6;">
<div>📍 ${cam.location}</div>
<div>📅 ${cam.date}</div>
<div>📼 ${cam.footage.length} events</div>
</div>
</div>
`
          )
          .join("");
      }
      function viewFootage(id) {
        const cam = cameras.find((c) => c.id === id);
        if (!cam) return;
        document.getElementById("footageContent").innerHTML = `
<h2 style="color:#00ff00;">${cam.id} - FOOTAGE LOG</h2>
<div style="color:#00aa00; margin:10px 0;">📍 ${cam.location}<br>📅 ${cam.date}</div>
${cam.footage
  .map(
    (e) =>
      `<div class="timestamp-entry"><div class="timestamp">[${e.time}]</div><div class="${
        e.alert ? "alert" : ""
      }" style="color:${e.alert ? "#ff0000" : "#00aa00"};">${e.event}</div></div>`
  )
  .join("")}
`;
        document.getElementById("footageModal").classList.add("active");
      }
      function closeFootage() {
        document.getElementById("footageModal").classList.remove("active");
      }
      function logout() {
        document.getElementById("accessPanel").classList.remove("hidden");
        document.getElementById("mainInterface").classList.remove("active");
        document.getElementById("accessCode").value = "";
      }
      window.onclick = (e) => {
        if (e.target.id === "footageModal") closeFootage();
      };
    </script>
  </body>
</html>
