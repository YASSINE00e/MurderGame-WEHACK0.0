<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSM Security System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff00;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #1a1a1a;
            border: 2px solid #00ff00;
            border-radius: 10px;
            overflow: hidden;
        }

        .header {
            background: #000;
            padding: 20px;
            border-bottom: 2px solid #00ff00;
            text-align: center;
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            text-shadow: 0 0 10px #00ff00;
        }

        .header p {
            color: #00aa00;
            font-size: 0.9rem;
        }

        .access-panel {
            padding: 40px;
            display: block;
        }

        .access-panel.hidden {
            display: none;
        }

        .access-form {
            background: #000;
            border: 2px solid #00ff00;
            padding: 30px;
            max-width: 500px;
            margin: 0 auto;
            border-radius: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #00ff00;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            background: #000;
            border: 1px solid #00ff00;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            box-shadow: 0 0 10px #00ff00;
        }

        .access-btn {
            width: 100%;
            padding: 12px;
            background: #00ff00;
            color: #000;
            border: none;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }

        .access-btn:hover {
            background: #00cc00;
        }

        .error-msg {
            background: #ff0000;
            color: #fff;
            padding: 10px;
            margin-top: 15px;
            text-align: center;
            display: none;
        }

        .hint-box {
            background: #002200;
            border-left: 4px solid #00ff00;
            padding: 15px;
            margin-top: 20px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #00ff00;
            text-decoration: none;
        }

        /* Main Interface */
        .main-interface {
            display: none;
            padding: 30px;
        }

        .main-interface.active {
            display: block;
        }

        .camera-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .camera-card {
            background: #000;
            border: 2px solid #00ff00;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .camera-card:hover {
            box-shadow: 0 0 20px #00ff00;
            transform: scale(1.02);
        }

        .camera-card.corrupted {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .camera-card.corrupted:hover {
            transform: none;
            box-shadow: none;
        }

        .camera-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .camera-id {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .camera-status {
            padding: 4px 10px;
            font-size: 0.8rem;
        }

        .status-active {
            background: #00ff00;
            color: #000;
        }

        .status-corrupted {
            background: #ff0000;
            color: #fff;
        }

        .camera-info {
            color: #00aa00;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .logout-btn {
            padding: 10px 20px;
            background: #ff0000;
            color: #fff;
            border: none;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            margin-bottom: 20px;
        }

        /* Footage Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #000;
            border: 3px solid #00ff00;
            width: 90%;
            max-width: 1000px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 2rem;
            color: #00ff00;
            cursor: pointer;
        }

        .footage-content {
            margin-top: 20px;
        }

        .footage-header {
            border-bottom: 2px solid #00ff00;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .timestamp-entry {
            background: #0a0a0a;
            border-left: 3px solid #00ff00;
            padding: 12px;
            margin-bottom: 10px;
        }

        .timestamp {
            color: #00ff00;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .event-desc {
            color: #00aa00;
            line-height: 1.5;
        }

        .alert {
            color: #ff0000;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📹 FSM SECURITY MONITORING SYSTEM</h1>
            <p>Faculty of Sciences - Sfax | CCTV Archive Access</p>
        </div>

        <!-- Access Panel -->
        <div class="access-panel" id="accessPanel">
            <div class="access-form">
                <h2 style="text-align: center; margin-bottom: 20px; color: #00ff00;">AUTHORIZED ACCESS ONLY</h2>
                
                <form onsubmit="accessSystem(event)">
                    <div class="form-group">
                        <label>ACCESS CODE</label>
                        <input type="password" id="accessCode" placeholder="Enter security code">
                    </div>
                    
                    <button type="submit" class="access-btn">ACCESS SYSTEM</button>
                    
                    <div class="error-msg" id="errorMsg">ACCESS DENIED</div>
                    
                    <div class="hint-box">
                        > HINT: Access code found in FSM administration records<br>
                        > Format: fsm + year
                    </div>
                </form>
                
                <a href="index.html" class="back-link">← EXIT SYSTEM</a>
            </div>
        </div>

        <!-- Main Interface -->
        <div class="main-interface" id="mainInterface">
            <button class="logout-btn" onclick="logout()">⬅ LOGOUT</button>
            
            <h2 style="margin-bottom: 20px;">AVAILABLE CAMERA FEEDS</h2>
            
            <div class="camera-grid" id="cameraGrid"></div>
        </div>
    </div>

    <!-- Footage Modal -->
    <div class="modal" id="footageModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeFootage()">&times;</span>
            <div class="footage-content" id="footageContent"></div>
        </div>
    </div>

    <script>
        const ACCESS_CODE = 'fsm2025';

        const cameras = [
            {
                id: 'CAM-01',
                location: 'Residence El Ferdaous - Main Entrance',
                date: 'December 10, 2025',
                status: 'active',
                footage: [
                    { time: '20:15:44', event: 'Aziz Ben Mahmoud enters building (alone, laptop bag)' },
                    { time: '21:08:22', event: 'Ela Trabelsi enters building (alone, checking phone)' },
                    { time: '21:37:14', event: 'Ela Trabelsi exits building (walking quickly, on phone)' },
                    { time: '21:52:33', event: 'Yassine Mahmoudi enters building (alone, dark jacket, backpack, nervous behavior)' },
                    { time: '22:18:41', event: '⚠ ALERT: Yassine Mahmoudi exits via EMERGENCY EXIT (running, NO backpack)', alert: true },
                    { time: '22:19:15', event: 'Security guard responds to emergency exit alarm' }
                ]
            },
            {
                id: 'CAM-02',
                location: 'Residence El Ferdaous - 3rd Floor Stairwell',
                date: 'December 10, 2025',
                status: 'active',
                footage: [
                    { time: '21:11:07', event: 'Female (Ela - clothing match) walks to 3rd floor, knocks on door' },
                    { time: '21:11:42', event: 'Door opens, Ela enters apartment' },
                    { time: '21:35:58', event: 'Ela exits apartment alone, walks down calmly' },
                    { time: '21:54:19', event: 'Male (Yassine - clothing match) runs up to 3rd floor, knocks urgently' },
                    { time: '21:55:03', event: 'Door opens, brief conversation visible (no audio)' },
                    { time: '21:55:28', event: 'Yassine enters apartment' },
                    { time: '22:17:22', event: '⚠ CRITICAL: Door BURSTS open, TWO FIGURES STRUGGLING near doorway', alert: true },
                    { time: '22:17:55', event: '⚠ CRITICAL: Yassine exits apartment ALONE, breathing heavily, looks back', alert: true },
                    { time: '22:18:02', event: '⚠ AUDIO: Loud CRASH recorded (approximate time of fall)', alert: true },
                    { time: '22:18:11', event: 'Yassine visible on 2nd floor landing, stops, looks up, continues running' }
                ]
            },
            {
                id: 'CAM-03',
                location: 'IEEE Office - Main Entrance',
                date: 'December 13, 2025',
                status: 'active',
                footage: [
                    { time: '20:18:33', event: 'Ela Trabelsi enters building (alone)' },
                    { time: '21:58:47', event: '⚠ Unknown person enters (hooded, face obscured, height ~175-180cm)', alert: true },
                    { time: '22:47:03', event: '⚠ Unknown person exits building RUNNING (face still obscured)', alert: true }
                ]
            },
            {
                id: 'CAM-04',
                location: 'FSM Library - Entrance',
                date: 'December 13, 2025',
                status: 'active',
                footage: [
                    { time: '20:15:22', event: 'Fares Jlassi enters library (alone)' },
                    { time: '23:22:18', event: 'Fares Jlassi exits library (alone)' }
                ]
            },
            {
                id: 'CAM-05',
                location: 'Main Campus Gate',
                date: 'December 10, 2025',
                status: 'corrupted',
                footage: []
            },
            {
                id: 'CAM-06',
                location: 'Parking Lot - South',
                date: 'December 12, 2025',
                status: 'corrupted',
                footage: []
            }
        ];

        function accessSystem(e) {
            e.preventDefault();
            const code = document.getElementById('accessCode').value.toLowerCase();
            
            if (code === ACCESS_CODE) {
                document.getElementById('accessPanel').classList.add('hidden');
                document.getElementById('mainInterface').classList.add('active');
                loadCameras();
            } else {
                const err = document.getElementById('errorMsg');
                err.style.display = 'block';
                setTimeout(() => err.style.display = 'none', 3000);
            }
        }

        function loadCameras() {
            const grid = document.getElementById('cameraGrid');
            grid.innerHTML = cameras.map(cam => `
                <div class="camera-card ${cam.status === 'corrupted' ? 'corrupted' : ''}" 
                     onclick="${cam.status === 'active' ? `viewFootage('${cam.id}')` : ''}">
                    <div class="camera-header">
                        <div class="camera-id">${cam.id}</div>
                        <div class="camera-status status-${cam.status}">${cam.status.toUpperCase()}</div>
                    </div>
                    <div class="camera-info">
                        <div>📍 ${cam.location}</div>
                        <div>📅 ${cam.date}</div>
                        <div>📼 ${cam.footage.length} events</div>
                    </div>
                </div>
            `).join('');
        }

        function viewFootage(cameraId) {
            const camera = cameras.find(c => c.id === cameraId);
            if (!camera) return;
            
            const content = document.getElementById('footageContent');
            content.innerHTML = `
                <div class="footage-header">
                    <h2 style="color: #00ff00;">${camera.id} - FOOTAGE LOG</h2>
                    <div style="color: #00aa00; margin-top: 10px;">
                        📍 Location: ${camera.location}<br>
                        📅 Date: ${camera.date}<br>
                        📼 Total Events: ${camera.footage.length}
                    </div>
                </div>
                
                ${camera.footage.map(entry => `
                    <div class="timestamp-entry">
                        <div class="timestamp">[${entry.time}]</div>
                        <div class="event-desc ${entry.alert ? 'alert' : ''}">${entry.event}</div>
                    </div>
                `).join('')}
            `;
            
            document.getElementById('footageModal').classList.add('active');
        }

        function closeFootage() {
            document.getElementById('footageModal').classList.remove('active');
        }

        function logout() {
            document.getElementById('accessPanel').classList.remove('hidden');
            document.getElementById('mainInterface').classList.remove('active');
            document.getElementById('accessCode').value = '';
        }

        window.onclick = (e) => {
            if (e.target.id === 'footageModal') closeFootage();
        };
    </script>
</body>
</html>
