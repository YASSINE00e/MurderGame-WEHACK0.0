      function login(e) {
        e.preventDefault();
        const input = document.getElementById("passwordInput").value.toLowerCase();
        if (input === PASSWORD) {
          document.getElementById("loginSection").classList.add("hidden");
          document.getElementById("fileBrowser").classList.add("active");
          render();
        } else {
          const err = document.getElementById("errorMsg");
          err.style.display = "block";
          setTimeout(() => (err.style.display = "none"), 3000);
        }
      }

      function goHome() {
        currentPath = [];
        render();
      }
      function openFolder(name) {
        currentPath.push(name);
        render();
      }
      function openFile(name) {
        const current = getCurrentLocation();
        const file = current[name];
        document.getElementById("docTitle").textContent = name;
        document.getElementById("docContent").textContent = file.content;
        document.getElementById("docModal").classList.add("active");
      }
      function closeDoc() {
        document.getElementById("docModal").classList.remove("active");
      }
      function getCurrentLocation() {
        let current = structure;
        for (let folder of currentPath) current = current[folder].files;
        return current;
      }

      function render() {
        updateBreadcrumb();
        const current = getCurrentLocation();
        const grid = document.getElementById("fileGrid");
        grid.innerHTML = Object.keys(current)
          .map((name) => {
            const item = current[name];
            if (item.type === "folder") {
              return `<div class="folder-card" onclick="openFolder('${name}')"><div class="folder-icon">${
                item.icon
              }</div><div class="item-name">${name}</div><div class="item-meta">${
                Object.keys(item.files).length
              } items</div></div>`;
            } else {
              return `<div class="file-card" onclick="openFile(\`${name}\`)"><div class="file-icon">📄</div><div class="item-name">${name}</div><div class="item-meta">${item.date} • ${item.size}</div></div>`;
            }
          })
          .join("");
      }

      function updateBreadcrumb() {
        const breadcrumb = document.getElementById("breadcrumb");
        let html = '<span class="breadcrumb-link" onclick="goHome()">📁 Home</span>';
        currentPath.forEach((folder, idx) => {
          html += " / ";
          if (idx === currentPath.length - 1) {
            html += `<span style="color: #333">${folder}</span>`;
          } else {
            html += `<span class="breadcrumb-link" onclick="navigateTo(${idx})">${folder}</span>`;
          }
        });
        breadcrumb.innerHTML = html;
      }

      function navigateTo(index) {
        currentPath = currentPath.slice(0, index + 1);
        render();
      }

      function search() {
        const term = document.getElementById("searchInput").value.toLowerCase();
        if (!term) {
          render();
          return;
        }
        const grid = document.getElementById("fileGrid");
        const results = [];
        function searchFolder(items, path) {
          Object.keys(items).forEach((name) => {
            const item = items[name];
            if (item.type === "file") {
              const matches =
                name.toLowerCase().includes(term) ||
                (item.keywords && item.keywords.some((k) => k.includes(term)));
              if (matches) results.push({ name, item, path });
            } else {
              searchFolder(item.files, [...path, name]);
            }
          });
        }
        searchFolder(structure, []);
        if (results.length === 0) {
          grid.innerHTML =
            '<div style="text-align:center; padding:60px; color:#999;">🔍 No files found</div>';
        } else {
          grid.innerHTML = results
            .map(
              (r) =>
                `<div class="file-card" onclick="openSearchResult('${r.path.join("/")}', \`${
                  r.name
                }\`)"><div class="file-icon">📄</div><div class="item-name">${
                  r.name
                }</div><div class="item-meta">${r.path.join(" / ")} • ${r.item.date}</div></div>`
            )
            .join("");
        }
      }

      function openSearchResult(path, name) {
        currentPath = path ? path.split("/") : [];
        openFile(name);
      }
      function clearSearch() {
        document.getElementById("searchInput").value = "";
        render();
      }
      window.onclick = (e) => {
        if (e.target.id === "docModal") closeDoc();
      };
