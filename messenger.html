        padding: 0;
        box-sizing: border-box;

        background: #f0f2f5;
        height: 100vh;
        overflow: hidden;
      }
      .messenger-container {
        display: flex;
        height: 100vh;
        max-width: 90%;
        margin: 0 auto;
        background: white;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
      }

      /* Login */
      .login-screen {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
      .login-screen.hidden {
        display: none;
      }
      .login-box {
        background: white;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        width: 90%;
        max-width: 400px;
      }
      .login-box h1 {
        color: #1877f2;
        text-align: center;
        margin-bottom: 10px;
        font-size: 2rem;
      }
      .login-box p {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
      }
      select,
      input {
        width: 100%;
        padding: 12px;
        border: 2px solid #ddd;
        border-radius: 8px;
        font-size: 1rem;
        margin-bottom: 15px;
      }
      .login-btn {
        width: 100%;
        padding: 12px;
        background: #1877f2;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.3s;
      }
      .login-btn:hover {
        background: #166fe5;
      }
      .error-msg {
        background: #fee;
        color: #c33;
        padding: 10px;
        border-radius: 6px;
        margin-top: 15px;
        display: none;
        text-align: center;
      }
      .back-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #1877f2;
        text-decoration: none;
      }

      /* Sidebar */
      .sidebar {
        width: 360px;
        border-right: 1px solid #e5e5e5;
        display: flex;
        flex-direction: column;
        background: white;
      }
      .sidebar.hidden {
        display: none;
      }
      .sidebar-header {
        padding: 20px;
        border-bottom: 1px solid #e5e5e5;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .user-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: linear-gradient(135deg, #667eea, #764ba2);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        font-size: 1.2rem;
      }
      .logout-btn {
        padding: 6px 12px;
        background: #e4e6eb;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s;
      }
      .logout-btn:hover {
        background: #d8dadf;
      }
      .search-box {
        padding: 15px;
        border-bottom: 1px solid #e5e5e5;
      }
      .search-box input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 20px;
        font-size: 0.9rem;
        margin: 0;
      }
      .conversation-list {
        flex: 1;
        overflow-y: auto;
      }
      .conversation-item {
        padding: 12px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        transition: background 0.2s;
        position: relative;
      }
      .conversation-item:hover {
        background: #f2f2f2;
      }
      .conversation-item.active {
        background: #e7f3ff;
      }
      .conversation-avatar {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        font-size: 1.3rem;
        flex-shrink: 0;
      }
      .unread-badge {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        background: #0084ff;
        color: white;
        font-size: 0.75rem;
        font-weight: bold;
        padding: 3px 8px;
        border-radius: 10px;
      }

      /* Chat Area */
      .chat-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: white;
      }
      .chat-area.hidden {
        display: none;
      }
      .chat-header {
        padding: 15px 20px;
        border-bottom: 1px solid #e5e5e5;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .chat-header-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .messages-container {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        background: #f0f2f5;
      }
      .message {
        margin-bottom: 8px;
        display: flex;
        align-items: flex-end;
        gap: 8px;
      }
      .message.sent {
        flex-direction: row-reverse;
      }
      .message-bubble {
        max-width: 60%;
        padding: 10px 14px;
        border-radius: 18px;
        word-wrap: break-word;
      }
      .message.received .message-bubble {
        background: #e4e6eb;
        color: #050505;
      }
      .message.sent .message-bubble {
        background: #0084ff;
        color: white;
      }
      .message-sender {
        font-size: 0.75rem;
        font-weight: 600;
        color: #65676b;
        margin-bottom: 4px;
        padding-left: 2px;
      }
      .message.sent .message-sender {
        text-align: right;
        padding-right: 2px;
      }
      .message-time {
        font-size: 0.75rem;
        color: #65676b;
        margin-top: 2px;
      }
      .message-input-container {
        padding: 15px 20px;
        border-top: 1px solid #e5e5e5;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .message-input {
        flex: 1;
        padding: 10px 15px;
        border: 1px solid #ddd;
        border-radius: 20px;
        font-size: 0.95rem;
        outline: none;
      }
      .send-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #0084ff;
        border: none;
        color: white;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
      }
      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #65676b;
      }
      .date-divider {
        text-align: center;
        margin: 20px 0;
        color: #65676b;
        font-size: 0.85rem;
      }
      .typing-indicator {
        display: none;
        padding: 10px 14px;
        background: #e4e6eb;
        border-radius: 18px;
        width: fit-content;
      }
      .typing-indicator span {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #65676b;
        margin: 0 2px;
        animation: typing 1.4s infinite;
      }
      .typing-indicator span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing-indicator span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes typing {
        0%,
        60%,
        100% {
          transform: translateY(0);
        }
        30% {
          transform: translateY(-10px);
        }
      }
      .status-indicator {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #31a24c;
        border: 2px solid white;
        position: absolute;
        bottom: 0;
        right: 0;
      }
      .status-indicator.offline {
        background: #8a8d91;
      }

      let currentUser = null;
      let currentChat = null;

      function login(e) {
        e.preventDefault();
        const profile = document.getElementById("profileSelect").value;
        const password = document.getElementById("passwordInput").value;
        if (!profile) {
          alert("Please select a profile");
          return;
        }
        if (profiles[profile] && profiles[profile].password === password) {
          currentUser = profile;
          showMessenger();
        } else {
          const err = document.getElementById("errorMsg");
          err.style.display = "block";
          setTimeout(() => (err.style.display = "none"), 3000);
        }
      }

      function showMessenger() {
        document.getElementById("loginScreen").classList.add("hidden");
        document.getElementById("sidebar").classList.remove("hidden");
        const user = profiles[currentUser];
        document.getElementById("currentAvatar").textContent = user.avatar;
        document.getElementById("currentUserName").textContent = user.name;
        loadConversations();
      }

      function loadConversations() {
        const user = profiles[currentUser];
        const list = document.getElementById("conversationList");
        list.innerHTML = user.conversations
          .map((contactId) => {
            const contact = contacts[contactId] || profiles[contactId];
            const convKey =
              contactId === "excom"
                ? "excom-group"
                : contactId.includes("_")
                ? `${currentUser}-${contactId}`
                : [currentUser, contactId].sort().join("-");
            const msgs = messages[convKey] || [];
            const lastMsg = msgs[msgs.length - 1];
            return `
                    <div class="conversation-item" onclick="openConversation('${contactId}')">
                        <div class="conversation-avatar" style="position: relative;">
                            ${contact.avatar}
                        </div>
                        <div style="flex:1;">
                            <div style="font-weight:600; color:#050505;">${contact.name}</div>
                            <div style="font-size:0.9rem; color:#65676b;">${
                              lastMsg ? lastMsg.text.substring(0, 30) + "..." : "No messages"
                            }</div>
                        </div>
                    </div>
                `;
          })
          .join("");
      }

      function filterConversations() {
        const searchTerm = document.getElementById("searchInput").value.toLowerCase();
        const items = document.querySelectorAll(".conversation-item");
        items.forEach((item) => {
          const name = item
            .querySelector("div[style*='font-weight:600']")
            .textContent.toLowerCase();
          if (name.includes(searchTerm)) {
            item.style.display = "flex";
          } else {
            item.style.display = "none";
          }
        });
      }

      function openConversation(contactId) {
        currentChat = contactId;
        const contact = contacts[contactId];
        const chatArea = document.getElementById("chatArea");
        chatArea.classList.remove("hidden");

        // Mark conversation as active
        document.querySelectorAll(".conversation-item").forEach((item) => {
          item.classList.remove("active");
        });
        event.currentTarget.classList.add("active");

        chatArea.innerHTML = `
                <div class="chat-header">
                    <div class="chat-header-left">
                        <div class="conversation-avatar" style="width:40px; height:40px; font-size:1rem; position: relative;">
                            ${contact.avatar}
                        </div>
                        <div>
                            <div style="font-weight:600; font-size:1.1rem;">${contact.name}</div>
                            <div style="font-size:0.85rem; color:#65676b;">Active now</div>
                        </div>
                    </div>
                </div>
                <div class="messages-container" id="messagesContainer"></div>
                <div class="message-input-container">
                    <input type="text" class="message-input" placeholder="Type a message..." id="messageInput" onkeypress="handleKeyPress(event)">
                    <button class="send-btn" onclick="sendMessage()">➤</button>
                </div>
            `;
        loadMessages(contactId);
      }

      function loadMessages(contactId) {
        const convKey =
          contactId === "excom"
            ? "excom-group"
            : contactId.includes("_")
            ? `${currentUser}-${contactId}`
            : [currentUser, contactId].sort().join("-");
        const msgs = messages[convKey] || [];
        const container = document.getElementById("messagesContainer");
        let lastDate = "";
        container.innerHTML = msgs
          .map((msg) => {
            const isSent = msg.sender === currentUser;
            const senderName =
              profiles[msg.sender]?.name || contacts[msg.sender]?.name || msg.sender;
            let dateDiv = "";
            if (msg.date && msg.date !== lastDate) {
              lastDate = msg.date;
              dateDiv = `<div class="date-divider">${msg.date}</div>`;
            }
            return (
              dateDiv +
              `
                    <div class="message ${isSent ? "sent" : "received"}">
                        <div>
                            <div class="message-sender">${senderName}</div>
                            <div class="message-bubble">${msg.text}</div>
                            <div class="message-time">${msg.time}</div>
                        </div>
                    </div>
                `
            );
          })
          .join("");
        container.scrollTop = container.scrollHeight;
      }

      function handleKeyPress(event) {
        if (event.key === "Enter") {
          sendMessage();
        }
      }

      function sendMessage() {
        const input = document.getElementById("messageInput");
        const text = input.value.trim();
        if (!text) return;

        const now = new Date();
        const time = now.toLocaleTimeString("en-US", {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        });
        const date = now.toLocaleDateString("en-US", { month: "long", day: "numeric" });

        const convKey =
          currentChat === "excom"
            ? "excom-group"
            : currentChat.includes("_")
            ? `${currentUser}-${currentChat}`
            : [currentUser, currentChat].sort().join("-");

        if (!messages[convKey]) {
          messages[convKey] = [];
        }

        messages[convKey].push({
          sender: currentUser,
          text: text,
          time: time,
          date: date,
        });

        input.value = "";
        loadMessages(currentChat);
      }

      function logout() {
        currentUser = null;
        currentChat = null;
        document.getElementById("loginScreen").classList.remove("hidden");
        document.getElementById("sidebar").classList.add("hidden");
        document.getElementById("chatArea").classList.add("hidden");
        document.getElementById("profileSelect").value = "";
        document.getElementById("passwordInput").value = "";
      }
    </script>
  </body>
</html>
