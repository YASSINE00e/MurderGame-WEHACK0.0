<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FaceConnect - Messages</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f0f2f5;
        height: 100vh;
        overflow: hidden;
      }
      .messenger-container {
        display: flex;
        height: 100vh;
        max-width: 1400px;
        margin: 0 auto;
        background: white;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
      }

      /* Login */
      .login-screen {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
      .login-screen.hidden {
        display: none;
      }
      .login-box {
        background: white;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        width: 90%;
        max-width: 400px;
      }
      .login-box h1 {
        color: #1877f2;
        text-align: center;
        margin-bottom: 10px;
        font-size: 2rem;
      }
      .login-box p {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
      }
      select,
      input {
        width: 100%;
        padding: 12px;
        border: 2px solid #ddd;
        border-radius: 8px;
        font-size: 1rem;
        margin-bottom: 15px;
      }
      .login-btn {
        width: 100%;
        padding: 12px;
        background: #1877f2;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
      }
      .error-msg {
        background: #fee;
        color: #c33;
        padding: 10px;
        border-radius: 6px;
        margin-top: 15px;
        display: none;
        text-align: center;
      }
      .back-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #1877f2;
        text-decoration: none;
      }

      /* Sidebar */
      .sidebar {
        width: 360px;
        border-right: 1px solid #e5e5e5;
        display: flex;
        flex-direction: column;
        background: white;
      }
      .sidebar.hidden {
        display: none;
      }
      .sidebar-header {
        padding: 20px;
        border-bottom: 1px solid #e5e5e5;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .user-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: linear-gradient(135deg, #667eea, #764ba2);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        font-size: 1.2rem;
      }
      .logout-btn {
        padding: 6px 12px;
        background: #e4e6eb;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      .conversation-list {
        flex: 1;
        overflow-y: auto;
      }
      .conversation-item {
        padding: 12px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        transition: background 0.2s;
      }
      .conversation-item:hover {
        background: #f2f2f2;
      }
      .conversation-item.active {
        background: #e7f3ff;
      }
      .conversation-avatar {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        font-size: 1.3rem;
      }

      /* Chat Area */
      .chat-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: white;
      }
      .chat-area.hidden {
        display: none;
      }
      .chat-header {
        padding: 15px 20px;
        border-bottom: 1px solid #e5e5e5;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .messages-container {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        background: #f0f2f5;
      }
      .message {
        margin-bottom: 8px;
        display: flex;
        align-items: flex-end;
        gap: 8px;
      }
      .message.sent {
        flex-direction: row-reverse;
      }
      .message-bubble {
        max-width: 60%;
        padding: 10px 14px;
        border-radius: 18px;
        word-wrap: break-word;
      }
      .message.received .message-bubble {
        background: #e4e6eb;
        color: #050505;
      }
      .message.sent .message-bubble {
        background: #0084ff;
        color: white;
      }
      .message-time {
        font-size: 0.75rem;
        color: #65676b;
        margin-top: 2px;
      }
      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #65676b;
      }
    </style>
  </head>
  <body>
    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
      <div class="login-box">
        <h1>💬 FaceConnect</h1>
        <p>Login to view messages</p>
        <form onsubmit="login(event)">
          <select id="profileSelect">
            <option value="">Choose a profile...</option>
            <option value="aziz">Aziz Krifa</option>
            <option value="ela">Ela Hassine</option>
            <option value="amine">Amine Zbaa</option>
            <option value="yassine">Yassine Azzouz</option>
            <option value="fares">Fares Klaii</option>
            <option value="roua">Roua Mabrouk</option>
          </select>
          <input type="password" id="passwordInput" placeholder="Enter password" />
          <button type="submit" class="login-btn">Login</button>
          <div class="error-msg" id="errorMsg">❌ Incorrect password</div>
        </form>
        <a href="index.html" class="back-link">← Back to Home</a>
      </div>
    </div>

    <!-- Messenger Interface -->
    <div class="messenger-container">
      <div class="sidebar hidden" id="sidebar">
        <div class="sidebar-header">
          <div style="display: flex; align-items: center; gap: 10px">
            <div class="user-avatar" id="currentAvatar"></div>
            <div id="currentUserName" style="font-weight: 600"></div>
          </div>
          <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
        <div class="conversation-list" id="conversationList"></div>
      </div>
      <div class="chat-area hidden" id="chatArea">
        <div class="empty-state">
          <div style="font-size: 5rem; margin-bottom: 20px">💬</div>
          <p>Select a conversation</p>
        </div>
      </div>
    </div>

    <script>
      const profiles = {
        aziz: {
          name: "Aziz Krifa",
          password: "wehack2025",
          avatar: "A",
          conversations: ["roua", "ela", "excom"],
        },
        ela: {
          name: "Ela Hassine",
          password: "treasurer123",
          avatar: "E",
          conversations: ["aziz"],
        },
        amine: {
          name: "Amine Zbaa",
          password: "cschair2025",
          avatar: "AM",
          conversations: ["aziz", "fares", "yassine", "excom"],
        },
        yassine: {
          name: "Yassine Azzouz",
          password: "yassine2025",
          avatar: "Y",
          conversations: ["aziz", "amine"],
        },
        fares: {
          name: "Fares Klaii",
          password: "design123",
          avatar: "F",
          conversations: ["amine"],
        },
        roua: { name: "Roua Mabrouk", password: "roua2025", avatar: "R", conversations: ["aziz"] },
      };

      const messages = {
        "aziz-roua": [
          {
            sender: "roua",
            text: "Aziz, we need to change the IEEE portal password",
            time: "14:22",
          },
          { sender: "aziz", text: "Yeah I know. What do you suggest?", time: "14:25" },
          { sender: "roua", text: "How about ieee@2025*", time: "14:27" },
          { sender: "aziz", text: "Too complex, people will forget", time: "14:28" },
          { sender: "roua", text: "paspas123123 maybe?", time: "14:30" },
          { sender: "aziz", text: "No way lol", time: "14:31" },
          { sender: "roua", text: "87667µµ£µ ???", time: "14:32" },
          { sender: "aziz", text: "Roua please 😂", time: "14:33" },
          { sender: "roua", text: "Fine you pick something", time: "14:35" },
          {
            sender: "aziz",
            text: "Let me encrypt it for security. Blaise de Vigenère method",
            time: "14:37",
          },
          { sender: "aziz", text: "New password: idmd2025", time: "14:40" },
          { sender: "aziz", text: "Key: IEEE", time: "14:41" },
          { sender: "roua", text: "Got it! Updating now", time: "14:45" },
        ],
        "aziz-ela": [
          { sender: "ela", text: "Aziz, I need to talk to you. Privately.", time: "20:45" },
          { sender: "aziz", text: "I think we said enough at the meeting.", time: "20:46" },
          {
            sender: "ela",
            text: "No. You're WRONG about me. I just found out during my audit!",
            time: "20:47",
          },
          {
            sender: "ela",
            text: "Listen, I'm not your enemy. But I think you're in danger.",
            time: "20:48",
          },
          { sender: "aziz", text: "From who?", time: "20:49" },
          { sender: "ela", text: "From the people you exposed. They're scared.", time: "20:49" },
          { sender: "ela", text: "Can I come to your apartment? 30 minutes?", time: "20:50" },
          { sender: "aziz", text: "Fine. But this doesn't change anything.", time: "20:52" },
        ],
        "amine-fares": [
          { sender: "fares", text: "Bro, I'm freaking out.", time: "21:15" },
          { sender: "amine", text: "Me too.", time: "21:16" },
          {
            sender: "fares",
            text: "I can't prove those design invoices were legitimate.",
            time: "21:17",
          },
          { sender: "fares", text: "What do I do? I'll get expelled.", time: "21:18" },
          { sender: "amine", text: "I don't know yet.", time: "21:19" },
          { sender: "fares", text: "Aziz has to be stopped.", time: "21:20" },
          { sender: "amine", text: "Fares, don't do anything stupid.", time: "21:23" },
        ],
        "amine-yassine": [
          {
            sender: "yassine",
            text: "This isn't about YOUR fees. It's about Aziz's accusations about ME.",
            time: "20:25",
          },
          { sender: "amine", text: "About the equipment purchases?", time: "20:26" },
          {
            sender: "yassine",
            text: "They're NOT REAL. He FABRICATED that evidence.",
            time: "20:27",
          },
          { sender: "yassine", text: "I'm going to talk to him tonight.", time: "20:47" },
        ],
        "aziz-yassine": [
          { sender: "yassine", text: "We need to talk. NOW.", time: "20:25" },
          { sender: "aziz", text: "About what?", time: "20:27" },
          {
            sender: "yassine",
            text: "About your accusations. Those equipment purchases are FAKE.",
            time: "20:28",
          },
          { sender: "aziz", text: "I have documents.", time: "20:29" },
          {
            sender: "yassine",
            text: "Then your documents are FORGED. Those companies dont exist!",
            time: "20:31",
          },
        ],
        "excom-group": [
          { sender: "roua", text: "Did everyone hear about Aziz? 😢", time: "Dec 11, 08:15" },
          {
            sender: "ikhlas",
            text: "I can't believe it... Police are investigating",
            time: "Dec 11, 08:18",
          },
          {
            sender: "yaakoub",
            text: "This is terrible. Does anyone know what happened?",
            time: "Dec 11, 08:22",
          },
          {
            sender: "amine",
            text: "Police told me they uploaded case files to their database",
            time: "Dec 11, 09:45",
          },
          {
            sender: "amine",
            text: "Case number is SFX-2025-1211-089 if anyone needs it",
            time: "Dec 11, 09:46",
          },
          { sender: "fares", text: "Why would we need the case number?", time: "Dec 11, 09:50" },
          {
            sender: "amine",
            text: "Public records. Anyone can search police database",
            time: "Dec 11, 09:52",
          },
          { sender: "roua", text: "This feels so surreal...", time: "Dec 11, 10:05" },
          {
            sender: "yassine",
            text: "We should probably not discuss this here",
            time: "Dec 11, 10:15",
          },
          {
            sender: "ela",
            text: "Actually, there might be a second case soon",
            time: "Dec 13, 22:00",
          },
          { sender: "ela", text: "Long story. Will explain tomorrow", time: "Dec 13, 22:01" },
        ],
      };

      let currentUser = null;

      function login(e) {
        e.preventDefault();
        const profile = document.getElementById("profileSelect").value;
        const password = document.getElementById("passwordInput").value;

        if (!profile) {
          alert("Please select a profile");
          return;
        }

        if (profiles[profile] && profiles[profile].password === password) {
          currentUser = profile;
          showMessenger();
        } else {
          const err = document.getElementById("errorMsg");
          err.style.display = "block";
          setTimeout(() => (err.style.display = "none"), 3000);
        }
      }

      function showMessenger() {
        document.getElementById("loginScreen").classList.add("hidden");
        document.getElementById("sidebar").classList.remove("hidden");

        const user = profiles[currentUser];
        document.getElementById("currentAvatar").textContent = user.avatar;
        document.getElementById("currentUserName").textContent = user.name;

        loadConversations();
      }

      function loadConversations() {
        const user = profiles[currentUser];
        const list = document.getElementById("conversationList");

        const contacts = {
          excom: { name: "EXCOM Group", avatar: "👥" },
          ...profiles,
        };

        list.innerHTML = user.conversations
          .map((contactId) => {
            const contact = contacts[contactId] || profiles[contactId];
            const convKey =
              contactId === "excom" ? "excom-group" : [currentUser, contactId].sort().join("-");
            const msgs = messages[convKey] || [];
            const lastMsg = msgs[msgs.length - 1];

            return `
                    <div class="conversation-item" onclick="openConversation('${contactId}')">
                        <div class="conversation-avatar">${contact.avatar}</div>
                        <div style="flex:1;">
                            <div style="font-weight:600; color:#050505;">${contact.name}</div>
                            <div style="font-size:0.9rem; color:#65676b;">${
                              lastMsg ? lastMsg.text.substring(0, 30) + "..." : "No messages"
                            }</div>
                        </div>
                    </div>
                `;
          })
          .join("");
      }

      function openConversation(contactId) {
        const contacts = { excom: { name: "EXCOM Group", avatar: "👥" }, ...profiles };
        const contact = contacts[contactId];
        const chatArea = document.getElementById("chatArea");

        chatArea.classList.remove("hidden");
        chatArea.innerHTML = `
                <div class="chat-header">
                    <div class="conversation-avatar" style="width:40px; height:40px; font-size:1rem;">${contact.avatar}</div>
                    <div style="font-weight:600; font-size:1.1rem;">${contact.name}</div>
                </div>
                <div class="messages-container" id="messagesContainer"></div>
            `;

        loadMessages(contactId);
      }

      function loadMessages(contactId) {
        const convKey =
          contactId === "excom" ? "excom-group" : [currentUser, contactId].sort().join("-");
        const msgs = messages[convKey] || [];
        const container = document.getElementById("messagesContainer");

        container.innerHTML = msgs
          .map((msg) => {
            const isSent = msg.sender === currentUser;
            return `
                    <div class="message ${isSent ? "sent" : "received"}">
                        <div>
                            <div class="message-bubble">${msg.text}</div>
                            <div class="message-time">${msg.time}</div>
                        </div>
                    </div>
                `;
          })
          .join("");

        container.scrollTop = container.scrollHeight;
      }

      function logout() {
        currentUser = null;
        document.getElementById("loginScreen").classList.remove("hidden");
        document.getElementById("sidebar").classList.add("hidden");
        document.getElementById("chatArea").classList.add("hidden");
        document.getElementById("profileSelect").value = "";
        document.getElementById("passwordInput").value = "";
      }
    </script>
  </body>
</html>
